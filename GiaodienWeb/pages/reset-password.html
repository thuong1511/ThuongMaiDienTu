<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - EXPED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <!-- Auth Container -->
    <div class="auth-container">
        <h1 class="auth-title">Đặt lại mật khẩu</h1>
        <p class="auth-subtitle">Nhập mã OTP đã được gửi đến email của bạn</p>
        
        <form id="resetPasswordForm">
            <div class="otp-container">
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Mật khẩu mới</label>
                <input 
                    type="password" 
                    id="newPassword"
                    class="form-input" 
                    placeholder="Nhập mật khẩu mới"
                    required
                >
            </div>
            
            <div class="form-group">
                <label class="form-label">Xác nhận mật khẩu</label>
                <input 
                    type="password" 
                    id="confirmPassword"
                    class="form-input" 
                    placeholder="Xác nhận mật khẩu mới"
                    required
                >
            </div>
            
            <button type="submit" class="btn-primary">Đặt lại mật khẩu</button>
        </form>
        
        <p class="bottom-text">
            Chưa nhận được mã? <a href="#" class="bottom-link" id="resendCode">Gửi lại</a>
        </p>
    </div>

    <script>
        // Auto focus next OTP input
        const otpInputs = document.querySelectorAll('.otp-input');
        
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Only allow numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
                
                for (let i = 0; i < pastedData.length && index + i < otpInputs.length; i++) {
                    otpInputs[index + i].value = pastedData[i];
                }
                
                const nextIndex = Math.min(index + pastedData.length, otpInputs.length - 1);
                otpInputs[nextIndex].focus();
            });
        });
    </script>
    <script src="../js/auth.js"></script>
</body>
</html>
