<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - EXPED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="animated-bg"></div>
        
        <div class="login-box">
            <div class="logo-section">
                <img src="../images/logo.png" alt="EXPED" class="logo-float">
            </div>
            
            <h2 class="login-title">ĐẶT LẠI MẬT KHẨU</h2>
            <p class="login-subtitle">Nhập mã OTP và mật khẩu mới</p>
            
            <form class="login-form" id="resetPasswordForm">
                <div class="input-group">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="text" placeholder="Mã OTP (6 số)" class="glass-input" id="otp" maxlength="6" required>
                </div>
                
                <div class="input-group">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" placeholder="Mật khẩu mới" class="glass-input" id="newPassword" required>
                </div>
                
                <div class="input-group">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" placeholder="Xác nhận mật khẩu" class="glass-input" id="confirmPassword" required>
                </div>
                
                <button type="submit" class="btn-login shimmer">
                    <span>ĐẶT LẠI MẬT KHẨU</span>
                </button>
                
                <div class="form-footer">
                    <a href="login.html" class="link-text">Quay lại đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('Mật khẩu xác nhận không khớp!');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Mật khẩu phải có ít nhất 6 ký tự!');
                return;
            }
            
            // Simulate password reset
            alert('Đặt lại mật khẩu thành công!');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
