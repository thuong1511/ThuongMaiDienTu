                <a href="admin-customers.html" class="nav-item">

            <h1 class="page-title">QUẢN LÝ ĐƠN HÀNG</h1>

            <div class="content-section">
                <div class="filter-bar-admin">
                    <div class="filter-group-admin">
                        <label>Trạng thái</label>
                        <select class="filter-select-admin">
                            <option value="">Tất cả</option>
                            <option value="pending">Chờ xử lý</option>
                            <option value="producing">Đang sản xuất</option>
                            <option value="shipping">Đang vận chuyển</option>
                            <option value="delivered">Đã giao</option>
                        </select>
                    </div>
                    <div class="filter-group-admin">
                        <label>Tìm kiếm</label>
                        <input type="text" placeholder="Mã đơn, tên khách hàng..." class="filter-input-admin">
                    </div>
                    <button class="btn-secondary-admin">Tìm kiếm</button>
                    <button class="btn-secondary-admin">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Xuất Excel
                    </button>
                </div>
            </div>

            <div class="content-section">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Khách hàng</th>
                            <th>Chiến dịch</th>
                            <th>Số lượng</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Ngày đặt</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr><td colspan="8" style="text-align:center;padding:30px;">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/admin-api.js"></script>
    <script>
    let allDonHang = [];

    document.addEventListener('DOMContentLoaded', async function () {
        await initAdminHeader();
        await loadDonHang();
        setupFilters();
    });

    async function loadDonHang() {
        const tbody = document.getElementById('orders-tbody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;">Đang tải...</td></tr>';
        try {
            const res = await adminApi.getAllDonHang();
            if (!res.success) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:red;">${res.message}</td></tr>`;
                return;
            }
            allDonHang = res.data;
            renderTable(allDonHang);
        } catch (e) {
            document.getElementById('orders-tbody').innerHTML =
                `<tr><td colspan="8" style="text-align:center;color:red;">Lỗi kết nối BE: ${e.message}</td></tr>`;
        }
    }

    function renderTable(list) {
        const tbody = document.getElementById('orders-tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;">Không có dữ liệu</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(dk => {
            const tt = dk.thanhToan || {};
            const cd = dk.chienDich || {};
            const nd = dk.nguoiDung || {};
            const statusCls = dk.daHuy ? 'failed' : 'success';
            const statusTxt = dk.daHuy ? 'Đã hủy' : (dk.trangThaiHoanTien ? 'Đã hoàn tiền' : 'Đang xử lý');
            return `
            <tr>
                <td><strong>#DK${dk.maDangKy}</strong></td>
                <td>${nd.tenDangNhap || '—'}</td>
                <td>${cd.tenChienDich || cd.maChienDich || '—'}</td>
                <td>${dk.tongSoLuong}</td>
                <td>${fmtMoney(tt.soTienThanhToan)}</td>
                <td><span class="status-badge ${statusCls}">${statusTxt}</span></td>
                <td>${fmtDate(dk.ngayDangKy)}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-icon view" title="Xem chi tiết" onclick="window.location.href='admin-order-detail.html?id=${dk.maDangKy}'">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                        ${!dk.daHuy ? `
                        <button class="btn-icon delete" title="Hủy đơn" onclick="huyDon(${dk.maDangKy})">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>` : ''}
                        ${dk.daHuy && !dk.trangThaiHoanTien ? `
                        <button class="btn-icon edit" title="Xác nhận hoàn tiền" onclick="hoanTien(${dk.maDangKy})">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                        </button>` : ''}
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function setupFilters() {
        const selTrangThai = document.querySelector('.filter-select-admin');
        const inputSearch = document.querySelector('.filter-input-admin');
        const allBtns = document.querySelectorAll('.btn-secondary-admin');
        const btnSearch = allBtns[0];
        const btnExcel = allBtns[1];

        if (btnExcel) {
            btnExcel.addEventListener('click', () => {
                window.location.href = adminApi.exportDonHangExcelUrl();
            });
        }

        if (selTrangThai) {
            selTrangThai.innerHTML = `
                <option value="">Tất cả</option>
                <option value="active">Đang xử lý</option>
                <option value="huy">Đã hủy</option>
                <option value="hoantien">Đã hoàn tiền</option>
            `;
            selTrangThai.addEventListener('change', () => {
                const val = selTrangThai.value;
                let filtered = allDonHang;
                if (val === 'active') filtered = allDonHang.filter(dk => !dk.daHuy);
                else if (val === 'huy') filtered = allDonHang.filter(dk => dk.daHuy);
                else if (val === 'hoantien') filtered = allDonHang.filter(dk => dk.trangThaiHoanTien);
                renderTable(filtered);
            });
        }

        if (btnSearch && inputSearch) {
            btnSearch.addEventListener('click', () => {
                const q = inputSearch.value.toLowerCase();
                const filtered = allDonHang.filter(dk =>
                    String(dk.maDangKy).includes(q) ||
                    dk.nguoiDung?.tenDangNhap?.toLowerCase().includes(q) ||
                    dk.chienDich?.tenChienDich?.toLowerCase().includes(q)
                );
                renderTable(filtered);
            });
        }
    }

    async function huyDon(id) {
        if (!confirm(`Hủy đơn hàng #DK${id}?`)) return;
        try {
            const res = await adminApi.huyDonHang(id);
            if (res.success) { showToast('Đã hủy đơn hàng'); await loadDonHang(); }
            else showToast(res.message, 'error');
        } catch (e) { showToast('Lỗi kết nối', 'error'); }
    }

    async function hoanTien(id) {
        if (!confirm(`Xác nhận hoàn tiền cho đơn #DK${id}?`)) return;
        try {
            const res = await adminApi.xacNhanHoanTien(id);
            if (res.success) { showToast('Đã xác nhận hoàn tiền'); await loadDonHang(); }
            else showToast(res.message, 'error');
        } catch (e) { showToast('Lỗi kết nối', 'error'); }
    }
    </script>
