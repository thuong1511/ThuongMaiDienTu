<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - EXPED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <!-- Auth Container -->
    <div class="auth-container">
        <h1 class="auth-title">Quên mật khẩu</h1>
        <p class="auth-subtitle">Vui lòng nhập email đã đăng ký của bạn. Chúng tôi sẽ gửi mã xác thực để đặt lại mật khẩu.</p>
        
        <form id="forgotPasswordForm">
            <div class="form-group">
                <input 
                    type="email" 
                    id="email"
                    class="form-input" 
                    placeholder="Nhập email"
                    required
                >
            </div>
            
            <button type="submit" class="btn-primary">Gửi mã xác thực</button>
        </form>
        
        <p class="bottom-text">
            Quay lại trang <a href="login.html" class="bottom-link">Đăng nhập</a>
        </p>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
