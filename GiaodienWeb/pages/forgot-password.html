<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - EXPED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="animated-bg"></div>
        
        <div class="login-box">
            <div class="logo-section">
                <img src="../images/logo.png" alt="EXPED" class="logo-float">
            </div>
            
            <h2 class="login-title">QUÊN MẬT KHẨU</h2>
            <p class="login-subtitle">Nhập email để nhận mã xác thực</p>
            
            <form class="login-form" id="forgotPasswordForm">
                <div class="input-group">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" placeholder="Email" class="glass-input" id="email" required>
                </div>
                
                <button type="submit" class="btn-login shimmer">
                    <span>GỬI MÃ XÁC THỰC</span>
                </button>
                
                <div class="form-footer">
                    <a href="login.html" class="link-text">Quay lại đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            // Simulate sending OTP
            alert('Mã xác thực đã được gửi đến email: ' + email);
            
            // Redirect to reset password page
            window.location.href = 'reset-password.html?email=' + encodeURIComponent(email);
        });
    </script>
</body>
</html>
