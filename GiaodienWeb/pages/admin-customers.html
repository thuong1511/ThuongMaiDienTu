                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="admin-campaigns.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    </svg>
                    <span>Quản lý chiến dịch</span>
                </a>
                <a href="admin-customers.html" class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Quản lý khách hàng</span>
                </a>
                <a href="admin-orders.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>

                    </svg>

        <main class="admin-main">
            <h1 class="page-title">QUẢN LÝ KHÁCH HÀNG</h1>

            <div class="content-section">
                <div class="filter-bar-admin">
                    <div class="filter-group-admin">
                        <label>Trạng thái</label>
                        <select class="filter-select-admin">
                            <option value="">Tất cả</option>
                            <option value="active">Hoạt động</option>
                            <option value="blocked">Bị khóa</option>
                        </select>
                    </div>
                    <div class="filter-group-admin">
                        <label>Tìm kiếm</label>
                        <input type="text" placeholder="Email, tên khách hàng..." class="filter-input-admin">
                    </div>
                    <button class="btn-secondary-admin">Tìm kiếm</button>
                </div>
            </div>

            <div class="content-section">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Khách hàng</th>
                            <th>Email</th>
                            <th>Số điện thoại</th>
                            <th>Tổng đơn</th>
                            <th>Tổng chi tiêu</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="customers-tbody">
                        <tr><td colspan="8" style="text-align:center;padding:30px;">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/admin-api.js"></script>
    <script>
    let allKhachHang = [];

    document.addEventListener('DOMContentLoaded', async function () {
        await initAdminHeader();
        await loadKhachHang();
        setupFilters();
    });

    async function loadKhachHang() {
        const tbody = document.getElementById('customers-tbody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;">Đang tải...</td></tr>';
        try {
            const res = await adminApi.getAllKhachHang();
            if (!res.success) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:red;">${res.message}</td></tr>`;
                return;
            }
            allKhachHang = res.data.filter(nd => nd.vaiTro === 'Khách hàng');
            renderTable(allKhachHang);
        } catch (e) {
            document.getElementById('customers-tbody').innerHTML =
                `<tr><td colspan="8" style="text-align:center;color:red;">Lỗi kết nối BE: ${e.message}</td></tr>`;
        }
    }

    function renderTable(list) {
        const tbody = document.getElementById('customers-tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;">Không có dữ liệu</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(nd => `
            <tr data-ma="${nd.maNguoiDung}">
                <td>#${nd.maNguoiDung}</td>
                <td>
                    <div class="campaign-cell">
                        <img src="../images/avt_rose.jpg" alt="${nd.tenDangNhap}" onerror="this.src='../images/avt_rose.jpg'">
                        <span>${nd.tenDangNhap}</span>
                    </div>
                </td>
                <td>${nd.email}</td>
                <td>${nd.soDienThoai || '—'}</td>
                <td data-stat="don">—</td>
                <td data-stat="tien">—</td>
                <td>${trangThaiBadge(nd.trangThai)}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-icon view" title="Xem chi tiết"
                            onclick="window.location.href='admin-customer-detail.html?id=${nd.maNguoiDung}'">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                        <button class="btn-icon delete"
                            title="${nd.trangThai === 'Hoạt động' ? 'Khóa' : 'Mở khóa'} tài khoản"
                            onclick="toggleKhachHang('${nd.maNguoiDung}', '${nd.trangThai}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </button>
                    </div>
                </td>
            </tr>`).join('');

        // Load thống kê async cho từng dòng
        list.forEach(nd => loadRowStats(nd.maNguoiDung));
    }

    async function loadRowStats(maNguoiDung) {
        try {
            const r = await adminApi.getThongKeKhachHang(maNguoiDung);
            if (!r.success) return;
            const t = r.data || {};
            const tr = document.querySelector(`#customers-tbody tr[data-ma="${maNguoiDung}"]`);
            if (!tr) return;
            tr.querySelector('[data-stat="don"]').textContent = Number(t.tongDon || 0).toLocaleString('vi-VN');
            tr.querySelector('[data-stat="tien"]').textContent = fmtMoney(t.tongChiTieu);
        } catch (_) {}
    }

    function applyFiltersKH() {
        const trangThai = document.getElementById('sel-trangthai')?.value || '';
        const q = document.getElementById('inp-search-kh')?.value.toLowerCase() || '';
        const filtered = allKhachHang.filter(nd => {
            if (trangThai && nd.trangThai !== trangThai) return false;
            if (q && !nd.tenDangNhap?.toLowerCase().includes(q) &&
                     !nd.email?.toLowerCase().includes(q) &&
                     !nd.soDienThoai?.includes(q)) return false;
            return true;
        });
        renderTable(filtered);
    }

    function setupFilters() {
        const selects = document.querySelectorAll('.filter-select-admin');
        if (selects[0]) selects[0].id = 'sel-trangthai';
        const input = document.querySelector('.filter-input-admin');
        if (input) input.id = 'inp-search-kh';
        const btn = document.querySelector('.btn-secondary-admin');
        if (btn) btn.id = 'btn-search-kh';

        const selTrangThai = document.getElementById('sel-trangthai');
        if (selTrangThai) {
            selTrangThai.innerHTML = `
                <option value="">Tất cả</option>
                <option value="Hoạt động">Hoạt động</option>
                <option value="Bị khóa">Bị khóa</option>
            `;
            selTrangThai.addEventListener('change', applyFiltersKH);
        }
        document.getElementById('btn-search-kh')?.addEventListener('click', applyFiltersKH);
        document.getElementById('inp-search-kh')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') applyFiltersKH();
        });
    }

    async function toggleKhachHang(id, trangThai) {
        const action = trangThai === 'Hoạt động' ? 'khóa' : 'mở khóa';
        if (!confirm(`Bạn có chắc muốn ${action} tài khoản này?`)) return;
        try {
            const res = await adminApi.toggleTrangThaiKhachHang(id);
            if (res.success) { showToast(`Đã ${action} tài khoản`); await loadKhachHang(); }
            else showToast(res.message, 'error');
        } catch (e) { showToast('Lỗi kết nối', 'error'); }
    }
    </script>
</body>
</html>
